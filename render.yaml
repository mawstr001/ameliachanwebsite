services:
  - type: web
    name: amelia-chan-violin
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: amelia-data
      mountPath: /opt/data
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: false
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/data
      # Admin edits and uploads are committed to the repo (see github-sync.js).
      # Fine-grained token: this repo only, "Contents: Read and write".
      - key: GITHUB_TOKEN
        sync: false
